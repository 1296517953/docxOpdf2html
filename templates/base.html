<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>

<!-- MathJax 3 —— 渲染 MathML 公式为美观的数学排版 -->
<script>
MathJax = {
  options: {
    enableMenu: false,          /* 禁用右键菜单，界面更干净 */
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/mml-chtml.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    max-width: 960px;
    margin: 40px auto;
    padding: 0 24px 80px;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    color: #1a1a1a;
    background: #fff;
  }
  h1, h2, h3, h4, h5, h6 { margin: 1em 0 0.4em; line-height: 1.3; }
  h1 { font-size: 2em; }
  h2 { font-size: 1.5em; }
  h3 { font-size: 1.25em; }
  p { margin: 0.5em 0; }

  /* ── 表格 ───────────────────────────── */
  .docx-table {
    width: 100%;
    border-collapse: collapse;
    margin: 1em 0;
  }
  .docx-table td, .docx-table th {
    border: 1px solid #ccc;
    padding: 8px 12px;
    vertical-align: top;
  }

  /* ── 列表 ───────────────────────────── */
  ul.docx-list, ol.docx-list {
    margin: 0.5em 0;
    padding-left: 2em;
  }

  /* ── 视频 ───────────────────────────── */
  .docx-video {
    display: block;
    max-width: 100%;
    margin: 1em 0;
    border-radius: 4px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.12);
  }

  /* ── 公式块级容器 ──────────────────── */
  .math-block {
    display: block;
    text-align: center;
    margin: 1em 0;
  }
  .math-block math[display="block"] {
    display: inline-block;
  }
</style>
</head>
<body>
{{ body }}
</body>
</html>
