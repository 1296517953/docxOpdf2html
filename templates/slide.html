<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: #e8e8e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 24px 0;
  }
  .slide {
    background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .slide p { margin: 0.15em 0; }

  /* navigation bar (static at top) */
  .nav-bar {
    position: sticky; top: 0; z-index: 100;
    background: #222; color: #fff;
    padding: 8px 20px; border-radius: 6px;
    display: flex; gap: 12px; align-items: center;
    font-size: 14px;
  }
  .nav-bar a { color: #8cf; text-decoration: none; }
  .nav-bar a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="nav-bar">
  <strong>{{ title }}</strong>
  <span style="font-size:12px;color:#aaa">共 {{ slide_count }} 页</span>
</div>
{{ slides }}
</body>
</html>
